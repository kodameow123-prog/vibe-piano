<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Piano 🎹</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: #121212;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; color: #fff;
        }
        h1 { margin: 0 0 10px; font-weight: 300; letter-spacing: 2px; }
        p { margin: 0 0 20px; color: #888; font-size: 14px; }
        .piano {
            display: flex; position: relative;
            background: #000; padding: 10px;
            border-radius: 8px; box-shadow: 0 20px 50px rgba(0,0,0,.5);
        }
        key { position: relative; cursor: pointer; user-select: none; }
        white {
            width: 60px; height: 250px;
            background: linear-gradient(to bottom,#eee 0%,#fff 100%);
            border: 1px solid #ccc; border-radius: 0 0 5px 5px; z-index: 1;
        }
        white:active,.white.active { background:#ddd; height:245px; }
        black {
            width: 36px; height: 150px;
            background: linear-gradient(to bottom,#555 0%,#000 100%);
            margin-left: -20px; margin-right: -20px; z-index: 2;
            border-radius: 0 0 3px 3px; border: 1px solid #000;
        }
        black:active,.black.active { background:#333; height:148px; }
        key::after {
            content: attr(data-note);
            position: absolute; bottom: 10px; left: 50%;
            transform: translateX(-50%); font-size: 12px; color: #aaa;
            pointer-events: none;
        }
        black::after { bottom: 5px; font-size: 10px; }
    </style>
</head>
<body>
    <h1>VIBE PIANO 🎹</h1>
    <p>Use your keyboard: <b>A S D F G H J K</b></p>
    <div class="piano" id="piano">
        <div class="key white" data-note="C" data-key="a"></div>
        <div class="key black" data-note="C#" data-key="w"></div>
        <div class="key white" data-note="D" data-key="s"></div>
        <div class="key black" data-note="D#" data-key="e"></div>
        <div class="key white" data-note="E" data-key="d"></div>
        <div class="key white" data-note="F" data-key="f"></div>
        <div class="key black" data-note="F#" data-key="t"></div>
        <div class="key white" data-note="G" data-key="g"></div>
        <div class="key black" data-note="G#" data-key="y"></div>
        <div class="key white" data-note="A" data-key="h"></div>
        <div class="key black" data-note="A#" data-key="u"></div>
        <div class="key white" data-note="B" data-key="j"></div>
        <div class="key white" data-note="C2" data-key="k"></div>
    </div>
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = {
            'a': {freq: 261.63}, 'w': {freq: 277.18}, 's': {freq: 293.66},
            'e': {freq: 311.13}, 'd': {freq: 329.63}, 'f': {freq: 349.23},
            't': {freq: 369.99}, 'g': {freq: 392.00}, 'y': {freq: 415.30},
            'h': {freq: 440.00}, 'u': {freq: 466.16}, 'j': {freq: 493.88},
            'k': {freq: 523.25}
        };
        function playNote(freq) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 1.5);
        }
        document.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            if (notes[key]) {
                playNote(notes[key].freq);
                const el = document.querySelector(`[data-key="${key}"]`);
                if (el) el.classList.add('active');
            }
        });
        document.addEventListener('keyup', e => {
            const key = e.key.toLowerCase();
            if (notes[key]) {
                const el = document.querySelector(`[data-key="${key}"]`);
                if (el) el.classList.remove('active');
            }
        });
        document.querySelectorAll('.key').forEach(keyEl => {
            keyEl.addEventListener('mousedown', () => {
                const key = keyEl.getAttribute('data-key');
                playNote(notes[key].freq);
                keyEl.classList.add('active');
            });
            keyEl.addEventListener('mouseup', () => keyEl.classList.remove('active'));
            keyEl.addEventListener('mouseleave', () => keyEl.classList.remove('active'));
        });
        window.addEventListener('mousedown', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
        });
    </script>
</body>
</html>
